site_name: MoMorph User Guide
site_url: https://framgia.github.io/momorph-support/

theme:
  name: material
  custom_dir: overrides
  language: ja
  features:
    - navigation.tabs # thanh tab điều hướng ngang trên cùng
    - navigation.sections # nhóm menu sidebar trái
    - navigation.top
    - toc.integrate # gộp TOC trong trang vào sidebar trái, tắt cột TOC bên phải
    - search.suggest
    - content.code.copy # nút copy cho code block
    - content.tabs.link
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - scheme: slate
      primary: teal
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: ja
          default: true
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            MoMorph V2 User Guide: MoMorph V2の使い方
            Migrating from V1 to V2: V1からV2への移行
            Archived (V1): アーカイブ（V1）
            General User Guide: ユーザーガイド
            MCP Tools Reference: MCPサーバーツール詳細
            FAQ: よくある質問
            Release Notes: リリースノート
        - locale: vi
          name: Tiếng Việt
          build: true
          nav_translations:
            Home: Trang chủ
            MoMorph V2 User Guide: Hướng dẫn sử dụng MoMorph V2
            Migrating from V1 to V2: Hướng dẫn chuyển từ V1 sang V2
            Archived (V1): Lưu trữ (V1)
            General User Guide: Hướng dẫn sử dụng
            MCP Tools Reference: Chi tiết công cụ MCP Server
            FAQ: Câu hỏi thường gặp
            Release Notes: Ghi chú phát hành
        - locale: en
          name: English
          build: true
          nav_translations:
            MCP Tools Reference: MCP Server Tools
            FAQ: FAQs

markdown_extensions:
  - attr_list # cho phép gán id tường minh {#id} cho heading (anchor ổn định cho JA)
  - toc:
      toc_depth: 3
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Sinh llms.txt + llms-full.<lang>.txt (bản plain-text cho AI) mỗi lần build
hooks:
  - hooks/llms_txt.py

# nav tham chiếu tên base (không suffix); plugin i18n resolve theo từng locale + nav_translations
nav:
  - Home: index.md
  - MoMorph V2 User Guide: v2-user-guide.md
  - Migrating from V1 to V2: v1-to-v2-migration.md
  - Archived (V1):
      - General User Guide: archived/general-user-guide.md
      - MCP Tools Reference: archived/mcp-tools-reference.md
      - FAQ: archived/faq.md
      - Release Notes: archived/release-notes.md
